
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Library of Lost Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #fdfcf9;
            --ink: #1a1a1a;
            --gold: #b2935b;
            --gold-light: #d4c19a;
            --shadow-soft: rgba(0, 0, 0, 0.03);
        }
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Montserrat', sans-serif;
            -webkit-font-smoothing: antialiased;
            cursor: default;
        }

        .font-serif { font-family: 'Cormorant Garamond', serif; }
        
        /* High-End Paper Texture */
        .paper-texture {
            position: fixed;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            opacity: 0.6;
            pointer-events: none;
            z-index: 50;
        }

        /* Ambient Lighting Effect */
        .ambient-light {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 40%, transparent 0%, rgba(20, 15, 10, 0.04) 100%);
            pointer-events: none;
            z-index: 45;
        }

        /* Custom Scrollbar - Minimalist */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-light);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold);
        }

        /* Refined Sidebar Scroll */
        .custom-scroll {
            scrollbar-width: thin;
            scrollbar-color: var(--gold-light) transparent;
            scroll-behavior: smooth;
        }
        .custom-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(178, 147, 91, 0.2);
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: rgba(178, 147, 91, 0.5);
        }

        /* Ink bleed reveal animation */
        @keyframes inkReveal {
            0% { filter: blur(8px); opacity: 0; transform: translateY(10px) scale(0.99); }
            100% { filter: blur(0); opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-ink {
            animation: inkReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Button Etching Effect */
        .btn-plaque {
            position: relative;
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-plaque:hover {
            border-color: var(--gold);
            background: white;
            box-shadow: 0 4px 20px var(--shadow-soft);
        }

        /* Selection styling */
        ::selection {
            background: var(--gold-light);
            color: white;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.27.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
</head>
<body>
    <div class="paper-texture"></div>
    <div class="ambient-light"></div>
    <div id="root" class="h-full w-full relative z-10"></div>
</body>
</html>
